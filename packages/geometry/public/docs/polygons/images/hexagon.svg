  <polygon points="80.0000,16.0000 131.9615,46.0000 131.9615,106.0000 80.0000,136.0000 28.0385,106.0000 28.0385,46.0000" fill="#187f7c" fill-opacity="0.16" stroke="#187f7c" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#187f7c">
