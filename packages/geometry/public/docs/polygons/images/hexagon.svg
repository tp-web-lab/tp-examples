  <g font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="2" stroke-linejoin="round">
    <text x="71" y="79" fill="#246c94">O</text>
    <text x="94.500" y="54.885" fill="#246c94">α</text>
    <text x="49.689" y="97.500" fill="#b84432">β</text>
