    <circle cx="131.9615" cy="46.0000" r="2.5"/>
    <circle cx="131.9615" cy="106.0000" r="2.5"/>
    <circle cx="80.0000" cy="136.0000" r="2.5"/>
    <circle cx="28.0385" cy="106.0000" r="2.5"/>
    <circle cx="28.0385" cy="46.0000" r="2.5"/>
  </g>
  <g fill="#187f7c" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="80" y="159" font-size="13" font-weight="600">Hexagone</text>
    <text x="80" y="177" font-size="12">6 côtés</text>
  </g>
  <g fill="none" stroke="#246c94" stroke-width="1.2">
